name: Tests

on:
  pull_request:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  pytest:
    # Supported runtimes (FAN-3458): the full suite must pass on every entry
    # of this matrix. Python 3.6.8 is no longer a target production runtime.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Smoke-test FastAPI and dependency-free WSGI entrypoint
        run: |
          python -c "from fastapi import FastAPI; assert FastAPI"
          AISTAT_PASSWORD_HASH=ci-smoke-placeholder \
          AISTAT_SESSION_SECRET=ci-smoke-session-secret-000000000000000000000000 \
          AISTAT_INGEST_SECRET=ci-smoke-ingest-secret-111111111111111111111111 \
          AISTAT_DB_PATH="$RUNNER_TEMP/aistat.db" \
          AISTAT_SECURITY_DB_PATH="$RUNNER_TEMP/security.db" \
          AISTAT_TENANTS_DIR="$RUNNER_TEMP/tenants" \
          python -S -c "import passenger_wsgi; assert callable(passenger_wsgi.application)"

      - name: Run full pytest suite
        run: python -m pytest tests/ -q

  # Required browser lane (FAN-3458): a pinned Chrome drives the real-browser
  # regression matrix. AISTAT_REQUIRE_BROWSER=1 turns a missing/unusable
  # browser binary into a hard failure, so this lane can never go green by
  # silently skipping the browser tests.
  browser:
    runs-on: ubuntu-latest
    env:
      AISTAT_REQUIRE_BROWSER: "1"
      AISTAT_CHROME: /opt/chrome/chrome
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Pinned browser: bump deliberately, together with a green run of the
      # visual/browser suites on the new version. A channel name is NOT a pin;
      # only an exact version is.
      - name: Install pinned Chrome 131.0.6778.85
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 131.0.6778.85
          install-dependencies: true

      - name: Verify the pinned browser binary is usable (fail, never skip)
        run: |
          "$AISTAT_CHROME" --version

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run real-browser regression suites
        run: |
          python -m pytest tests/test_dashboard_browser.py tests/test_auth_browser.py tests/test_cdp_protocol.py -q
